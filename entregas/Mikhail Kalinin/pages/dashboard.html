<!DOCTYPE html>
<html lang="en-US">
<html data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/styles.css">
  <title>Dashboard — Learnplat</title>
</head>
<body>
  <header class="navbar">
    <a href="dashboard.html" class="navbar__logo">Learning Platform</a>
    <nav>
      <ul class="navbar__links">
        <li><a href="dashboard.html" aria-current="page">Dashboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="login.html">Exit</a></li>
        <li><a href="profile.html" class="avatar" aria-label="Go to profile">JS</a></li>
      </ul>
    </nav>
  </header>

  <main>
  <div class="page-header">
    <h1>Subjects of study</h1>
    <p>Choose a subject to study.</p>
  </div>

  <label for="search" class="search-label">Search</label>
  <input type="search" id="search" class="search" placeholder="Search...">

  <section class="dashboard-grid" aria-label="Available courses">
    <article class="card">
      <h3>Mathematics</h3>
      <p>mathematics course</p>
      <button class="button" type="button">Take</button>
    </article>

    <article class="card">
      <h3>Physics</h3>
      <p>physics course</p>
      <button class="button" type="button">Take</button>
    </article>

    <article class="card">
      <h3>Programming</h3>
      <p>programming course</p>
      <button class="button" type="button">Take</button>
    </article>

    <article class="card">
      <h3>History</h3>
      <p>history course</p>
      <button class="button" type="button">Take</button>
    </article>

    <article class="card">
      <h3>Literature</h3>
      <p>literature course</p>
      <button class="button" type="button">Take</button>
    </article>

    <article class="card">
      <h3>Сhemistry</h3>
      <p>chemistry course</p>
      <button class="button" type="button">Take</button>
    </article>

  </section>
  </main>
</body>
</html>
